# 진입점. /api → 백엔드, (온프렘만) 나머지 → 프론트. /actuator는 연결하지 않는다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newsbrief.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8080
      {{- if and .Values.ingress.frontend .Values.frontend.enabled }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      {{- end }}
