{{- if .Values.mysql.inCluster }}
# 온프렘: 클러스터 안 MySQL
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newsbrief.labels" . | nindent 4 }}
data:
  custom.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    default-time-zone='+00:00'
    ngram_token_size=2
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    app: mysql
    {{- include "newsbrief.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {app: mysql}
  ports:
  - name: mysql
    port: 3306
---
# selector·serviceName·volumeClaimTemplates는 만든 뒤 바꿀 수 없다. 기존 매니페스트와 똑같이 유지할 것
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newsbrief.labels" . | nindent 4 }}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
      - name: mysql
        image: {{ .Values.mysql.image }}
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: mysql-secret, key: root-password}}
        - name: MYSQL_DATABASE
          value: news
        - name: MYSQL_USER
          value: news_app
        - name: MYSQL_PASSWORD
          valueFrom: {secretKeyRef: {name: mysql-secret, key: password}}
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: config
          mountPath: /etc/mysql/conf.d
        readinessProbe:
          exec:
            command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {memory: 1Gi}
      volumes:
      - name: config
        configMap: {name: mysql-config}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: {{ .Values.mysql.storage }}}
{{- else }}
# AWS: RDS를 클러스터 안 이름(mysql)으로 연결. 앱 설정은 온프렘과 같다
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newsbrief.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ required "mysql.externalHost (RDS 주소)가 필요합니다" .Values.mysql.externalHost | quote }}
  ports:
  - name: mysql
    port: 3306
{{- end }}
