# 요약 배치 (30분마다). 앞 회차가 끝나지 않았으면 겹쳐 돌지 않는다
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newsbrief.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backend.batch.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.backend.batch.activeDeadlineSeconds }}
      template:
        metadata:
          labels: {app: batch}
        spec:
          restartPolicy: Never
          initContainers:
          {{- include "newsbrief.waitMysql" . | nindent 10 }}
          containers:
          - name: batch
            image: {{ include "newsbrief.backendImage" . }}
            env:
            {{- include "newsbrief.backendEnv" (dict "role" "batch") | nindent 12 }}
            envFrom:
            - configMapRef: {name: backend-config}
            resources:
              {{- toYaml .Values.backend.resources | nindent 14 }}
