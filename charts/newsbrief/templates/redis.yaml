{{- if .Values.redis.inCluster }}
# 온프렘: 클러스터 안 Redis (캐시 전용, 디스크 저장 안 함)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newsbrief.labels" . | nindent 4 }}
spec:
  selector: {app: redis}
  ports:
  - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newsbrief.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
      - name: redis
        image: {{ .Values.redis.image }}
        args: ["--save", "", "--appendonly", "no",
               "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
        ports:
        - containerPort: 6379
        readinessProbe:
          exec: {command: ["redis-cli", "ping"]}
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 384Mi}
{{- else }}
# AWS: ElastiCache를 클러스터 안 이름(redis)으로 연결
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newsbrief.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ required "redis.externalHost (ElastiCache 주소)가 필요합니다" .Values.redis.externalHost | quote }}
  ports:
  - name: redis
    port: 6379
{{- end }}
