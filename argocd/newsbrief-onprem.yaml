# 온프렘 앱 (Argo CD Application)
# deploy/onprem 브랜치 하나만 읽는다. 이 브랜치 = develop 내용 + 이미지 태그 파일(deploy/tags-onprem.yaml)
#  - 배포: deploy-onprem workflow가 develop을 합친 뒤 태그를 커밋
#  - 차트만 바뀔 때: sync-deploy-onprem workflow가 develop 머지 직후 합침
# develop은 보호 규칙이 있어 workflow가 직접 커밋할 수 없고, Argo CD는 한 앱에서 같은 저장소의 다른 브랜치를 같이 읽지 못해서 이렇게 둔다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: newsbrief-onprem
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: news
  source:
    repoURL: https://github.com/Team-likelion-3rd-Project/likelion-devops-7th-3rd-team01-infra.git
    targetRevision: deploy/onprem
    path: charts/newsbrief
    helm:
      # Helm으로 배포하던 릴리스 이름과 같게 둔다 (렌더링 결과·라벨이 그대로라 넘겨받을 때 파드가 재시작되지 않음)
      releaseName: newsbrief
      valueFiles:
      - values-onprem.yaml
      - ../../deploy/tags-onprem.yaml
  syncPolicy:
    automated:
      # 차트에서 빠진 리소스는 지운다
      prune: true
      # kubectl로 바꾼 상태를 Git 기준으로 되돌린다. 장애 시험 중에는 끈다 (argocd/README.md)
      selfHeal: true
