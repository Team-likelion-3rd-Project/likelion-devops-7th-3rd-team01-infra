# 배포 SA(news/deployer)가 Argo CD에 "지금 Git 다시 읽어라"(refresh)를 요청할 수 있게 하는 권한
# Application 조회·주석 변경만 허용. 동기화 설정·다른 앱은 바꾸지 않는다 (deploy-onprem workflow가 사용)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer-refresh
  namespace: argocd
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  resourceNames: ["newsbrief-onprem"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-refresh
  namespace: argocd
subjects:
- kind: ServiceAccount
  name: deployer
  namespace: news
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer-refresh
