# 온프렘 진입점 (Traefik). /api → 백엔드, 나머지 → 프론트. /actuator는 연결하지 않음
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: news
  namespace: news
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
