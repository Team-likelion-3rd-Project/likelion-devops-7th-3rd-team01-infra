# etcd 스냅샷 백업 (M4-7). 매일 03:20, 7일 보관. 적용: kubectl apply -f k8s/onprem/backup/
# 저장 위치: k8s-cp의 /var/backups/etcd (root만 접근)
# 주의: 스냅샷에는 모든 Secret이 평문으로 들어 있다. 저장소·채팅에 올리지 않고, 외부로 옮길 때는 암호화한다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: kube-system
spec:
  schedule: "20 3 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app: etcd-backup}
        spec:
          restartPolicy: Never
          # etcd는 control plane의 127.0.0.1:2379에서만 열려 있으므로 그 노드의 호스트 네트워크에서 실행한다
          hostNetwork: true
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          initContainers:
          # 클러스터의 etcd와 같은 버전 이미지 (kubeadm 업그레이드 후 함께 올린다)
          # 이 이미지에는 셸이 없어서 파일 이름 정리는 다음 컨테이너에서 한다
          - name: snapshot
            image: registry.k8s.io/etcd:3.6.6-0
            command:
            - etcdctl
            - --endpoints=https://127.0.0.1:2379
            - --cacert=/etc/kubernetes/pki/etcd/ca.crt
            - --cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt
            - --key=/etc/kubernetes/pki/etcd/healthcheck-client.key
            - snapshot
            - save
            - /backup/.etcd-snapshot.part
            volumeMounts:
            - {name: pki, mountPath: /etc/kubernetes/pki/etcd, readOnly: true}
            - {name: backup, mountPath: /backup}
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {memory: 256Mi}
          # 받은 스냅샷이 깨지지 않았는지 검사 (해시·키 개수 출력)
          - name: verify
            image: registry.k8s.io/etcd:3.6.6-0
            command: [etcdutl, snapshot, status, /backup/.etcd-snapshot.part, -w, table]
            volumeMounts:
            - {name: backup, mountPath: /backup}
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 128Mi}
          containers:
          - name: rotate
            image: busybox:1.36.1
            env:
            - {name: TZ, value: KST-9}
            command:
            - sh
            - -c
            - |
              set -e
              chmod 700 /backup
              f=/backup/etcd-$(date +%Y%m%d-%H%M).db
              mv /backup/.etcd-snapshot.part "$f"
              chmod 600 "$f"
              find /backup -name 'etcd-*.db' -mtime +6 -delete
              ls -lh /backup
            volumeMounts:
            - {name: backup, mountPath: /backup}
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {memory: 32Mi}
          volumes:
          - name: pki
            hostPath: {path: /etc/kubernetes/pki/etcd, type: Directory}
          - name: backup
            hostPath: {path: /var/backups/etcd, type: DirectoryOrCreate}
