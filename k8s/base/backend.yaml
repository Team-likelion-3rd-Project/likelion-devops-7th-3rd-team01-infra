# 백엔드 (API / 워커 / 요약 배치) — 같은 이미지, APP_ROLE만 다름
# 사전 준비: Secret mysql-secret(password), app-secret(JWT_SECRET) 생성
# 환경별 설정(ConfigMap backend-config)은 k8s/onprem/backend-config.yaml, k8s/cloud/backend-config.yaml
# 세 역할 모두 initContainer(wait-mysql)가 MySQL 포트가 열릴 때까지 기다린 뒤 앱을 시작한다
# IMAGE: 이미지 주소·태그 확정 후 교체 (커밋 SHA 태그, latest 금지)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: news
  labels: {app: api}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
      # 재부팅 직후 MySQL·클러스터 DNS보다 앱이 먼저 떠서 재시작이 반복되던 문제 방지
      - name: wait-mysql
        image: busybox:1.36.1
        command: ['sh', '-c', 'until nc -z -w 2 mysql 3306; do echo "MySQL 대기 중"; sleep 2; done']
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 32Mi}
      containers:
      - name: api
        image: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team01-backend:IMAGE_TAG
        ports:
        - name: http   # PodMonitor(k8s/onprem/monitoring/backend-podmonitor.yaml)가 이름으로 찾는다
          containerPort: 8080
        # 롤링 배포 중 실패 0건 (M5-9): 엔드포인트에서 빠지는 동안 10초 기다린 뒤 종료 신호를 보낸다.
        # 앱은 처리 중 요청을 최대 15초 기다린다 → 10 + 15 = 25초 < terminationGracePeriodSeconds 30초
        lifecycle:
          preStop:
            exec: {command: ['sleep', '10']}
        env:
        - name: APP_ROLE
          value: api
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom: {secretKeyRef: {name: mysql-secret, key: password}}
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: app-secret, key: JWT_SECRET}}
        envFrom:
        - configMapRef: {name: backend-config}
        startupProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8080}
          periodSeconds: 5
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: news
spec:
  selector: {app: api}
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: news
  labels: {app: worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
      # 재부팅 직후 MySQL·클러스터 DNS보다 앱이 먼저 떠서 재시작이 반복되던 문제 방지
      - name: wait-mysql
        image: busybox:1.36.1
        command: ['sh', '-c', 'until nc -z -w 2 mysql 3306; do echo "MySQL 대기 중"; sleep 2; done']
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 32Mi}
      containers:
      - name: worker
        image: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team01-backend:IMAGE_TAG
        # 워커는 요청을 받지 않아 preStop이 필요 없다. 처리 중 질문을 최대 40초 기다리고 못 끝내면 대기열로 돌려놓는다 (< 60초)
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: APP_ROLE
          value: worker
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom: {secretKeyRef: {name: mysql-secret, key: password}}
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: app-secret, key: JWT_SECRET}}
        envFrom:
        - configMapRef: {name: backend-config}
        startupProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8080}
          periodSeconds: 10
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {memory: 1Gi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch
  namespace: news
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1500
      template:
        metadata:
          labels: {app: batch}
        spec:
          restartPolicy: Never
          initContainers:
          # 재부팅 직후 MySQL·클러스터 DNS보다 앱이 먼저 떠서 재시작이 반복되던 문제 방지
          - name: wait-mysql
            image: busybox:1.36.1
            command: ['sh', '-c', 'until nc -z -w 2 mysql 3306; do echo "MySQL 대기 중"; sleep 2; done']
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {memory: 32Mi}
          containers:
          - name: batch
            image: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team01-backend:IMAGE_TAG
            env:
            - name: APP_ROLE
              value: batch
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-secret, key: password}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: app-secret, key: JWT_SECRET}}
            envFrom:
            - configMapRef: {name: backend-config}
            resources:
              requests: {cpu: 250m, memory: 512Mi}
              limits: {memory: 1Gi}
