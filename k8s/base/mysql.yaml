apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: news
data:
  custom.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    default-time-zone='+00:00'
    ngram_token_size=2
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: news
  labels: {app: mysql}
spec:
  clusterIP: None
  selector: {app: mysql}
  ports:
  - name: mysql
    port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: news
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: mysql-secret, key: root-password}}
        - name: MYSQL_DATABASE
          value: news
        - name: MYSQL_USER
          value: news_app
        - name: MYSQL_PASSWORD
          valueFrom: {secretKeyRef: {name: mysql-secret, key: password}}
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: config
          mountPath: /etc/mysql/conf.d
        readinessProbe:
          exec:
            command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {memory: 1Gi}
      volumes:
      - name: config
        configMap: {name: mysql-config}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: 10Gi}
