# RDS·ElastiCache를 클러스터 안 이름(mysql, redis)으로 연결한다. 온프렘 매니페스트를 그대로 쓰기 위한 별칭
# ${DB_HOST}, ${REDIS_HOST}는 deploy-aws workflow가 GitHub Variables(terraform output 값)로 채운다
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: news
spec:
  type: ExternalName
  externalName: "${DB_HOST}"
  ports:
  - name: mysql
    port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: news
spec:
  type: ExternalName
  externalName: "${REDIS_HOST}"
  ports:
  - name: redis
    port: 6379
