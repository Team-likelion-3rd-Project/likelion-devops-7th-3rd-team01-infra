# AWS 진입점 (ALB → 워커 NodePort 30080 → Traefik). 화면은 CloudFront·S3라 /api만 연결. /actuator는 연결하지 않음
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: news-api
  namespace: news
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8080
