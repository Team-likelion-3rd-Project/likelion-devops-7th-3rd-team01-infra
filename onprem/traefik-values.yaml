# Traefik 설정 (온프렘)
#   helm upgrade --install traefik traefik/traefik --version 41.7.1 -n traefik --create-namespace \
#     -f onprem/traefik-values.yaml
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
ingressClass:
  isDefaultClass: true

# 요청 수·응답 코드·응답 시간 지표 (M4-6). 클러스터 안 Service(traefik-metrics:9100)로만 열고
# ServiceMonitor로 Prometheus가 수집한다. 외부 NodePort로는 노출하지 않는다
metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
