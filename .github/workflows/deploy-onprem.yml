# 온프렘(develop) 배포 — Helm 차트 charts/newsbrief + values-onprem.yaml (M5-7)
# - 앱 CI가 이미지 push 후 repository_dispatch(deploy-onprem)로 호출: client_payload {app, sha}
# - 수동 재배포·롤백: Actions 탭 → deploy-onprem → Run workflow (app, sha 입력)
# - 한 앱만 배포할 때 다른 앱의 이미지 태그는 클러스터에서 지금 값을 읽어 그대로 넘긴다
# self-hosted runner에서 실행되므로 pull_request 트리거는 절대 추가하지 않는다
name: deploy-onprem

on:
  repository_dispatch:
    types: [deploy-onprem]
  workflow_dispatch:
    inputs:
      app:
        description: 배포할 앱
        type: choice
        options: [backend, frontend]
        required: true
      sha:
        description: 배포할 전체 커밋 SHA (40자리)
        required: true

permissions:
  contents: read

# Helm 릴리스 하나(newsbrief)를 백엔드·프론트가 같이 쓰므로 배포를 한 줄로 세운다
# (동시에 돌면 "another operation is in progress"로 실패)
concurrency:
  group: deploy-onprem
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, onprem]
    timeout-minutes: 15
    env:
      # 입력값은 env로만 넘기고 run 안에 ${{ }}로 직접 넣지 않는다 (명령 주입 방지)
      APP: ${{ github.event.client_payload.app || inputs.app }}
      SHA: ${{ github.event.client_payload.sha || inputs.sha }}
      NS: news
      RELEASE: newsbrief
      CHART: charts/newsbrief
      # 릴리스 기록을 ConfigMap에 저장 (배포 SA에 Secret 권한을 주지 않기 위해)
      HELM_DRIVER: configmap
    steps:
      - uses: actions/checkout@v5

      - name: 입력값 검증
        run: |
          case "$APP" in backend|frontend) ;; *) echo "::error::app은 backend 또는 frontend: '$APP'"; exit 1;; esac
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha는 40자리 소문자 16진수: '$SHA'"; exit 1; }
          echo "배포: $APP @ $SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Helm 배포
        run: |
          # 배포하지 않는 앱은 지금 실행 중인 태그를 유지한다
          cur() { kubectl get "deployment/$1" -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://'; }
          if [ "$APP" = backend ]; then B="$SHA"; F="$(cur frontend)"; else B="$(cur api)"; F="$SHA"; fi
          [[ "$B" =~ ^[0-9a-f]{40}$ && "$F" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::현재 이미지 태그를 읽지 못함 (backend '$B', frontend '$F')"; exit 1; }
          echo "backend $B / frontend $F" | tee -a "$GITHUB_STEP_SUMMARY"
          helm upgrade --install "$RELEASE" "$CHART" -n "$NS" \
            -f "$CHART/values-onprem.yaml" \
            --set-string backend.image.tag="$B" \
            --set-string frontend.image.tag="$F" \
            --history-max 10
          helm history "$RELEASE" -n "$NS" --max 3 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 롤아웃 완료 대기
        run: |
          if [ "$APP" = backend ]; then deploys="api worker"; else deploys="frontend"; fi
          for d in $deploys; do
            kubectl rollout status "deployment/$d" -n "$NS" --timeout=5m
          done

      - name: 배포 버전 확인
        run: |
          if [ "$APP" = backend ]; then
            got="$(kubectl get --raw "/api/v1/namespaces/$NS/services/api:8080/proxy/actuator/info" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')"
          else
            got="$(kubectl get deployment/frontend -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://')"
          fi
          echo "실행 중인 버전: $got" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$SHA" ] || { echo "::error::배포 버전 불일치 (기대 $SHA, 실제 $got)"; exit 1; }

      - name: 실패 시 상태 기록
        if: failure()
        run: |
          helm status "$RELEASE" -n "$NS" || true
          kubectl get pods -n "$NS" -o wide || true
          kubectl get events -n "$NS" --sort-by=.lastTimestamp | tail -20 || true
