# 온프렘(develop) 배포 — GitOps (Argo CD, M5)
# - 앱 CI가 이미지 push 후 repository_dispatch(deploy-onprem)로 호출: client_payload {app, sha}
# - 수동 재배포·롤백: Actions 탭 → deploy-onprem → Run workflow (app, sha 입력)
# 이 workflow는 클러스터를 직접 바꾸지 않는다. deploy/onprem 브랜치에 develop을 합치고 태그 파일을 커밋하면,
# 클러스터 안의 Argo CD가 그 커밋을 보고 배포한다. 끝나면 실제 실행 버전을 확인한다
# self-hosted runner에서 실행되므로 pull_request 트리거는 절대 추가하지 않는다
name: deploy-onprem

on:
  repository_dispatch:
    types: [deploy-onprem]
  workflow_dispatch:
    inputs:
      app:
        description: 배포할 앱
        type: choice
        options: [backend, frontend]
        required: true
      sha:
        description: 배포할 전체 커밋 SHA (40자리)
        required: true

# deploy/onprem 브랜치에 태그 커밋을 올리기 위해 쓰기 권한 필요 (develop·main은 보호 규칙으로 막혀 있음)
permissions:
  contents: write

# 태그 파일 하나를 백엔드·프론트가 같이 고치므로 한 줄로 세운다
concurrency:
  group: deploy-onprem
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, onprem]
    timeout-minutes: 20
    env:
      # 입력값은 env로만 넘기고 run 안에 ${{ }}로 직접 넣지 않는다 (명령 주입 방지)
      APP: ${{ github.event.client_payload.app || inputs.app }}
      SHA: ${{ github.event.client_payload.sha || inputs.sha }}
      NS: news
      TAGS: deploy/tags-onprem.yaml
    steps:
      - name: 입력값 검증
        run: |
          case "$APP" in backend|frontend) ;; *) echo "::error::app은 backend 또는 frontend: '$APP'"; exit 1;; esac
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha는 40자리 소문자 16진수: '$SHA'"; exit 1; }
          echo "배포: $APP @ $SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        with:
          ref: deploy/onprem
          fetch-depth: 0

      - name: 태그 커밋 (deploy/onprem)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # deploy/onprem = develop + 태그 파일. 최신 차트로 배포하도록 develop을 먼저 합친다
          git merge -q --no-edit origin/develop
          tag_of() { sed -n "/^$1:/,/tag:/s/^ *tag: *//p" "$TAGS" | tr -d '"'; }
          B="$(tag_of backend)"; F="$(tag_of frontend)"
          if [ "$APP" = backend ]; then B="$SHA"; else F="$SHA"; fi
          [[ "$B" =~ ^[0-9a-f]{40}$ && "$F" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::태그 파일을 읽지 못함 (backend '$B', frontend '$F')"; exit 1; }
          cat > "$TAGS" <<TAGS_EOF
          # deploy-onprem workflow가 갱신한다. Argo CD가 이 파일의 태그로 온프렘에 배포한다
          # 롤백: deploy-onprem을 이전 SHA로 수동 실행 (또는 이 파일의 이전 커밋으로 되돌리기)
          backend:
            image:
              tag: "$B"
          frontend:
            image:
              tag: "$F"
          TAGS_EOF
          git add "$TAGS"
          if git diff --cached --quiet; then
            echo "태그 변화 없음 (같은 버전 재배포)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "deploy(onprem): $APP $SHA"
            echo "태그 커밋: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # develop 합친 것만 있어도 올린다 (없으면 그대로)
          git push -q origin HEAD:deploy/onprem

      - name: Argo CD 반영 대기
        run: |
          # Argo CD는 약 3분마다 Git을 확인해 반영한다. 새 이미지가 적용될 때까지 기다린다
          # (새로고침 요청은 쓰지 않는다: Application 수정 권한을 주면 배포 대상까지 바꿀 수 있어서)
          if [ "$APP" = backend ]; then deploys="api worker"; else deploys="frontend"; fi
          for i in $(seq 1 60); do
            ok=true
            for d in $deploys; do
              img="$(kubectl get "deployment/$d" -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}')"
              [ "${img##*:}" = "$SHA" ] || ok=false
            done
            $ok && { echo "Argo CD 반영 확인 (약 $((i * 10))초)" | tee -a "$GITHUB_STEP_SUMMARY"; break; }
            [ "$i" = 60 ] && { echo "::error::10분 안에 Argo CD가 반영하지 않음 (Argo CD 화면에서 newsbrief-onprem 상태 확인)"; exit 1; }
            sleep 10
          done

      - name: 롤아웃 완료 대기
        run: |
          if [ "$APP" = backend ]; then deploys="api worker"; else deploys="frontend"; fi
          for d in $deploys; do
            kubectl rollout status "deployment/$d" -n "$NS" --timeout=5m
          done

      - name: 배포 버전 확인
        run: |
          if [ "$APP" = backend ]; then
            got="$(kubectl get --raw "/api/v1/namespaces/$NS/services/api:8080/proxy/actuator/info" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')"
          else
            got="$(kubectl get deployment/frontend -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://')"
          fi
          echo "실행 중인 버전: $got" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$SHA" ] || { echo "::error::배포 버전 불일치 (기대 $SHA, 실제 $got)"; exit 1; }

      - name: 실패 시 상태 기록
        if: failure()
        run: |
          kubectl get pods -n "$NS" -o wide || true
          kubectl get events -n "$NS" --sort-by=.lastTimestamp | tail -20 || true
