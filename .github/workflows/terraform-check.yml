name: terraform-check

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terraform-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # PR code must not execute on the on-prem runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install verified Terraform CLI
        # Organization permits GitHub-owned Actions only. Use the official CLI
        # archive, with its published SHA256 pinned below, without an install Action.
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://releases.hashicorp.com/terraform/1.16.6/terraform_1.16.6_linux_amd64.zip \
            --output terraform.zip
          echo '38034b38d03096399a7a1264a14561a8029b2b496fd1f169452656e53968f1b7  terraform.zip' | sha256sum --check --strict
          mkdir -p terraform-cli
          unzip -q terraform.zip -d terraform-cli
          echo "$PWD/terraform-cli" >> "$GITHUB_PATH"

      # Each check keeps going on failure so the PR comment can show all results.
      - name: Format
        id: fmt
        continue-on-error: true
        run: terraform fmt -check -recursive 2>&1 | tee "$RUNNER_TEMP/fmt.log"
      - name: Initialize without backend
        id: init
        continue-on-error: true
        run: terraform init -backend=false -lockfile=readonly -input=false 2>&1 | tee "$RUNNER_TEMP/init.log"
      - name: Validate
        id: validate
        if: steps.init.outcome == 'success'
        continue-on-error: true
        run: terraform validate -no-color 2>&1 | tee "$RUNNER_TEMP/validate.log"
      - name: Mock topology and input tests
        id: test
        if: steps.init.outcome == 'success'
        continue-on-error: true
        run: terraform test -no-color 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Read-only plan. Runs only for same-repo PRs and only when the repository
      # variables exist, so the checks above keep working without them.
      - name: Assume read-only AWS role
        id: aws
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          vars.AWS_PLAN_ROLE_ARN != '' && vars.TFVARS != ''
        continue-on-error: true
        env:
          ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        # Organization permits GitHub-owned Actions only, so exchange the OIDC
        # token for short-lived credentials with curl and the preinstalled AWS CLI.
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
          echo "::add-mask::${token}"
          creds="$(aws sts assume-role-with-web-identity \
            --role-arn "${ROLE_ARN}" \
            --role-session-name "terraform-plan-${GITHUB_RUN_ID}" \
            --web-identity-token "${token}" \
            --region ap-northeast-2 \
            --query Credentials --output json)"
          key="$(jq -r .AccessKeyId <<< "${creds}")"
          secret="$(jq -r .SecretAccessKey <<< "${creds}")"
          session="$(jq -r .SessionToken <<< "${creds}")"
          echo "::add-mask::${key}"
          echo "::add-mask::${secret}"
          echo "::add-mask::${session}"
          {
            echo "AWS_ACCESS_KEY_ID=${key}"
            echo "AWS_SECRET_ACCESS_KEY=${secret}"
            echo "AWS_SESSION_TOKEN=${session}"
            echo "AWS_DEFAULT_REGION=ap-northeast-2"
          } >> "$GITHUB_ENV"
      - name: Plan (read-only)
        id: plan
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        env:
          TFVARS: ${{ vars.TFVARS }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${account_id}"
          # The workflow log is public. Never print the plan itself.
          printf '%s\n' "$TFVARS" > terraform.tfvars
          terraform init -reconfigure -input=false -lockfile=readonly \
            -backend-config="bucket=team01-newsbrief-tfstate-${account_id}" > /dev/null
          terraform plan -input=false -lock=false -no-color \
            -out="$RUNNER_TEMP/tfplan" > /dev/null
          terraform show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"
          # Keep only the action and the address of each changed resource.
          jq -r '
            [ .resource_changes[]?
              | select(.change.actions != ["no-op"] and .change.actions != ["read"])
              | "\(.change.actions | join("+"))  \(.address)" ]
            | if length == 0 then ["변경 없음"] else . end
            | .[]
          ' "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/plan-summary.txt"

      - name: Comment results on PR
        # Fork PRs get a read-only token, so only comment on same-repo PRs.
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          FMT: ${{ steps.fmt.outcome }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          TEST: ${{ steps.test.outcome }}
          PLAN: ${{ steps.aws.outcome == 'failure' && 'failure' || steps.plan.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.RUNNER_TEMP;
            const marker = '<!-- terraform-check -->';
            const icon = { success: '✅', failure: '❌', skipped: '⏭️', cancelled: '🚫' };
            const rows = [
              ['fmt', '포맷 (fmt)', process.env.FMT],
              ['init', '초기화 (init)', process.env.INIT],
              ['validate', '문법 검사 (validate)', process.env.VALIDATE],
              ['test', '모의 테스트 (test)', process.env.TEST],
              ['plan', '계획 (plan, 읽기 전용)', process.env.PLAN],
            ];

            let body = `${marker}\n## Terraform 검사 결과\n\n| 단계 | 결과 |\n|---|---|\n`;
            for (const [, label, outcome] of rows) {
              body += `| ${label} | ${icon[outcome] ?? outcome} |\n`;
            }

            for (const [key, label, outcome] of rows) {
              if (outcome !== 'failure' || key === 'plan') continue;
              let log = '';
              try { log = fs.readFileSync(`${dir}/${key}.log`, 'utf8'); } catch (e) {}
              log = log.split('\n').slice(-40).join('\n').slice(-3000);
              body += `\n<details><summary>${label} 실패 로그</summary>\n\n\`\`\`\`\n${log}\n\`\`\`\`\n\n</details>\n`;
            }

            // The plan is public once commented, so only addresses and actions are posted.
            if (process.env.PLAN === 'success') {
              let summary = '';
              try { summary = fs.readFileSync(`${dir}/plan-summary.txt`, 'utf8').trim(); } catch (e) {}
              const lines = summary.split('\n');
              const shown = lines.slice(0, 60).join('\n');
              const more = lines.length > 60 ? `\n... 외 ${lines.length - 60}건` : '';
              body += `\n<details open><summary>변경 예정 리소스</summary>\n\n\`\`\`\n${shown}${more}\n\`\`\`\n\n</details>\n`;
            } else if (process.env.PLAN === 'failure') {
              body += `\n> plan이 실패했습니다. 원문에 민감한 값이 있을 수 있어 댓글에는 올리지 않습니다. Actions 로그를 확인하세요.\n`;
            } else {
              body += `\n> plan은 건너뛰었습니다. 같은 레포의 PR이고 \`AWS_PLAN_ROLE_ARN\`, \`TFVARS\` 변수가 있을 때만 실행합니다.\n`;
            }

            body += `\n[Actions 실행 보기](${process.env.RUN_URL}) · 커밋 ${context.sha.slice(0, 7)}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if any check failed
        if: >-
          steps.fmt.outcome == 'failure' || steps.init.outcome == 'failure' ||
          steps.validate.outcome == 'failure' || steps.test.outcome == 'failure' ||
          steps.aws.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1