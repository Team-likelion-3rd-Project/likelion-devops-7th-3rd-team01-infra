# AWS(main) 배포 — GitOps (EKS Argo CD, M5-3)
# - 백엔드 CI가 main에서 이미지 push 후 repository_dispatch(deploy-aws)로 호출: client_payload {app: backend, sha}
# - 수동 재배포·롤백: Actions 탭 → deploy-aws → Run workflow (sha 입력)
# 이 workflow는 클러스터에 접근하지 않는다 (GitHub 호스팅 러너).
# deploy/aws 브랜치에 develop을 합치고 태그 파일을 커밋하면 EKS 안의 Argo CD(newsbrief-aws)가 3분 안에 반영한다.
# AWS는 운영이라 develop을 자동으로 합치지 않고, 이 workflow가 돌 때만 차트 변경이 함께 나간다
# 접속 주소·화면 주소·AI 모드는 저장소가 아니라 EKS의 Argo CD Application에 있다 (k8s/cloud/README.md)
name: deploy-aws

on:
  repository_dispatch:
    types: [deploy-aws]
  workflow_dispatch:
    inputs:
      sha:
        description: 배포할 백엔드 전체 커밋 SHA (40자리)
        required: true

# deploy/aws 브랜치에 태그 커밋을 올리기 위해 쓰기 권한 필요 (develop·main은 보호 규칙으로 막혀 있음)
permissions:
  contents: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # 운영 배포 기록·승인자는 Settings → Environments → prod
    environment: prod
    timeout-minutes: 15
    env:
      # 입력값은 env로만 넘기고 run 안에 ${{ }}로 직접 넣지 않는다 (명령 주입 방지)
      APP: ${{ github.event.client_payload.app || 'backend' }}
      SHA: ${{ github.event.client_payload.sha || inputs.sha }}
      APP_ORIGIN: ${{ vars.AWS_APP_ORIGIN }}
      TAGS: deploy/tags-aws.yaml
    steps:
      - name: 입력값 검증
        run: |
          [ "$APP" = backend ] || { echo "::error::AWS 클러스터는 백엔드만 배포: '$APP'"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha는 40자리 소문자 16진수: '$SHA'"; exit 1; }
          [[ "$APP_ORIGIN" =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::AWS_APP_ORIGIN은 https://로 시작하는 주소"; exit 1; }
          echo "배포: backend @ $SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        with:
          ref: deploy/aws
          fetch-depth: 0

      - name: 태그 커밋 (deploy/aws)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # deploy/aws = develop + 태그 파일. 배포할 때 최신 차트를 함께 내보낸다
          git merge -q --no-edit origin/develop
          cat > "$TAGS" <<TAGS_EOF
          # deploy-aws workflow가 갱신한다. Argo CD(EKS)가 이 파일의 태그로 AWS에 배포한다
          # 롤백: deploy-aws를 이전 SHA로 수동 실행 (또는 이 파일의 이전 커밋으로 되돌리기)
          backend:
            image:
              tag: "$SHA"
          TAGS_EOF
          git add "$TAGS"
          if git diff --cached --quiet; then
            echo "태그 변화 없음 (같은 버전 재배포)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "deploy(aws): backend $SHA"
            echo "태그 커밋: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          git push -q origin HEAD:deploy/aws

      - name: 반영 확인 (공개 주소)
        run: |
          # 클러스터 밖이라 kubectl로 확인할 수 없다. 공개 API로 확인한다
          # - 응답 헤더 X-App-Version이 있으면 실행 중인 커밋이 SHA와 같아질 때까지 기다린다 (최대 10분)
          # - 헤더가 아직 없으면(백엔드 미지원) 정상 응답(200)만 확인하고, 실제 반영은 Argo CD 화면에서 본다
          url="$APP_ORIGIN/api/news/home"
          for i in $(seq 1 60); do
            headers="$(curl -s -o /dev/null -D - --max-time 10 "$url" || true)"
            code="$(printf '%s' "$headers" | awk 'NR==1{print $2}')"
            ver="$(printf '%s' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-app-version"{print $2}')"
            if [ -n "$ver" ]; then
              [ "$ver" = "$SHA" ] && { echo "실행 중인 버전: $ver (약 $((i * 10))초)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
            elif [ "$code" = 200 ] && [ "$i" -ge 18 ]; then
              # 헤더가 없으면 Argo CD 주기(3분)가 지난 뒤 정상 응답만 확인
              echo "API 정상 응답(200). 실행 버전 헤더가 없어 SHA 확인은 Argo CD 화면에서 (newsbrief-aws)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::10분 안에 확인되지 않음 (마지막 응답 코드 '$code', 실행 버전 '$ver')"
          exit 1
