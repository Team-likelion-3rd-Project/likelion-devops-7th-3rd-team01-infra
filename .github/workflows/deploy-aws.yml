# AWS(main) 배포 — 백엔드만, Helm 차트 charts/newsbrief + values-aws.yaml (M5-7)
# 프론트는 frontend 저장소 workflow가 S3·CloudFront로 배포한다
# - 백엔드 CI가 main에서 이미지 push 후 repository_dispatch(deploy-aws)로 호출: client_payload {app: backend, sha}
# - 수동 재배포·롤백·AI 모드 변경 반영: Actions 탭 → deploy-aws → Run workflow (sha 입력)
# AWS control plane의 self-hosted runner(라벨 aws)에서 실행. pull_request 트리거는 절대 추가하지 않는다
# 필요한 GitHub Variables (Settings → Secrets and variables → Actions → Variables, 저장소 파일에 두지 않음)
#   AWS_DB_HOST, AWS_REDIS_HOST (terraform output db_endpoint, redis_endpoint)
#   AWS_APP_ORIGIN (https://app.<도메인>), AWS_AI_MODE (mock | bedrock)
name: deploy-aws

on:
  repository_dispatch:
    types: [deploy-aws]
  workflow_dispatch:
    inputs:
      sha:
        description: 배포할 백엔드 전체 커밋 SHA (40자리)
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, aws]
    # 운영 배포 승인자는 Settings → Environments → prod 에서 지정
    environment: prod
    timeout-minutes: 20
    env:
      # 입력값은 env로만 넘기고 run 안에 ${{ }}로 직접 넣지 않는다 (명령 주입 방지)
      APP: ${{ github.event.client_payload.app || 'backend' }}
      SHA: ${{ github.event.client_payload.sha || inputs.sha }}
      NS: news
      DB_HOST: ${{ vars.AWS_DB_HOST }}
      REDIS_HOST: ${{ vars.AWS_REDIS_HOST }}
      APP_ORIGIN: ${{ vars.AWS_APP_ORIGIN }}
      AI_MODE: ${{ vars.AWS_AI_MODE || 'mock' }}
      RELEASE: newsbrief
      CHART: charts/newsbrief
      # 릴리스 기록을 ConfigMap에 저장 (배포 SA에 Secret 권한을 주지 않기 위해, 온프렘과 같음)
      HELM_DRIVER: configmap
    steps:
      - uses: actions/checkout@v5

      - name: 입력값 검증
        run: |
          [ "$APP" = backend ] || { echo "::error::AWS 클러스터는 백엔드만 배포: '$APP'"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha는 40자리 소문자 16진수: '$SHA'"; exit 1; }
          [[ "$DB_HOST" =~ ^[a-z0-9.-]+$ && "$REDIS_HOST" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::AWS_DB_HOST·AWS_REDIS_HOST Variables 확인"; exit 1; }
          [[ "$APP_ORIGIN" =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::AWS_APP_ORIGIN은 https://로 시작하는 주소"; exit 1; }
          case "$AI_MODE" in mock|bedrock) ;; *) echo "::error::AWS_AI_MODE는 mock 또는 bedrock: '$AI_MODE'"; exit 1;; esac
          echo "배포: backend @ $SHA (AI_MODE=$AI_MODE)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Helm 배포
        run: |
          # 접속 주소·화면 주소·AI 모드는 저장소가 아니라 GitHub Variables에서 넘긴다
          args=(-n "$NS" -f "$CHART/values-aws.yaml"
            --set-string backend.image.tag="$SHA"
            --set-string mysql.externalHost="$DB_HOST"
            --set-string redis.externalHost="$REDIS_HOST"
            --set-string backend.config.CORS_ALLOWED_ORIGINS="$APP_ORIGIN"
            --set-string backend.config.AI_MODE="$AI_MODE")
          before="$(kubectl get deployment/api -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          # 설정(ConfigMap)이 바뀌는지 미리 확인. 환경 변수는 파드가 시작할 때만 읽으므로
          # 이미지가 같고 설정만 바뀌면(AI 모드 전환 등) 재시작해야 반영된다
          # 값(data)만 비교한다. kubectl diff는 Helm 전환 뒤 라벨·이전 apply 기록 차이 때문에 값이 같아도 "바뀜"으로 나온다
          helm template "$RELEASE" "$CHART" "${args[@]}" --show-only templates/backend-config.yaml > "$RUNNER_TEMP/backend-config.yaml"
          want="$(kubectl create --dry-run=client -f "$RUNNER_TEMP/backend-config.yaml" -o jsonpath='{.data}')"
          have="$(kubectl get configmap/backend-config -n "$NS" -o jsonpath='{.data}' 2>/dev/null || true)"
          if [ "$want" = "$have" ]; then config_changed=false; else config_changed=true; fi
          helm upgrade --install "$RELEASE" "$CHART" "${args[@]}" --history-max 10
          if [ "$config_changed" = true ] && [ "${before##*:}" = "$SHA" ]; then
            echo "같은 이미지, 설정만 변경 → 재시작" | tee -a "$GITHUB_STEP_SUMMARY"
            kubectl rollout restart deployment/api deployment/worker -n "$NS"
          fi
          helm history "$RELEASE" -n "$NS" --max 3 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 롤아웃 완료 대기
        run: |
          for d in api worker; do
            kubectl rollout status "deployment/$d" -n "$NS" --timeout=6m
          done

      - name: 배포 버전 확인
        run: |
          got="$(kubectl get --raw "/api/v1/namespaces/$NS/services/api:8080/proxy/actuator/info" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')"
          echo "실행 중인 버전: $got" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$SHA" ] || { echo "::error::배포 버전 불일치 (기대 $SHA, 실제 $got)"; exit 1; }

      - name: 실패 시 상태 기록
        if: failure()
        run: |
          helm status "$RELEASE" -n "$NS" || true
          kubectl get pods -n "$NS" -o wide || true
          kubectl get events -n "$NS" --sort-by=.lastTimestamp | tail -20 || true
